services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stockpilot}
      POSTGRES_USER: ${POSTGRES_USER:-stockpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - stockpilot-data:/var/lib/postgresql/data

  api:
    build:
      context: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-demo}
      SPRING_DATASOURCE_URL: ${DATABASE_URL:-jdbc:postgresql://db:5432/stockpilot}
      SPRING_DATASOURCE_USERNAME: ${DATABASE_USERNAME:-stockpilot}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-false}
      APP_PUBLIC_API_URL: http://localhost:${API_PORT:-8081}/api
      APP_PUBLIC_WEB_URL: http://localhost:${WEB_PORT:-3000}
      APP_FROM_EMAIL: ${APP_FROM_EMAIL:-no-reply@stockpilot.local}
      APP_COOKIE_SECURE: ${APP_COOKIE_SECURE:-false}
      APP_AUTH_RATE_LIMIT_SECRET: ${APP_AUTH_RATE_LIMIT_SECRET:-local-development-only-change-before-deploy}
      APP_AUTH_RATE_LIMIT_TRUSTED_PROXIES: ${APP_AUTH_RATE_LIMIT_TRUSTED_PROXIES:-}
      APP_CORS_ALLOWED_ORIGINS: http://localhost:${WEB_PORT:-3000},http://127.0.0.1:${WEB_PORT:-3000}
      EXCHANGE_RATE_API_URL: ${EXCHANGE_RATE_API_URL:-https://open.er-api.com}
      EXCHANGE_RATE_INITIAL_DELAY: ${EXCHANGE_RATE_INITIAL_DELAY:-10000}
      EXCHANGE_RATE_REFRESH_DELAY: ${EXCHANGE_RATE_REFRESH_DELAY:-86400000}
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - "127.0.0.1:${API_PORT:-8081}:8080"

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:${SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_WEB_PORT:-8025}:8025"

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8081/api}
    depends_on:
      - api
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"

volumes:
  stockpilot-data:
